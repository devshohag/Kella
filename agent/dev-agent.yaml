# Local development config. Run: go run ./cmd/kella-agent --config ./dev-agent.yaml
cloudUrl: http://localhost:5080
enrollmentKey: kella_dev_local_only        # created by the API's DevSeed in Development
tokenPath: ./.dev/token
statePath: ./.dev/state
heartbeatInterval: 15s
flushInterval: 3s
logs:
  auth: ./.dev/auth.log                 # append lines from internal/parsers/testdata/auth.log to simulate attacks
  mail: ./.dev/mail.log
actions:
  dryRun: true                          # log nft commands instead of running them
  requireSigned: false                  # TODO(Phase 1): true once the API signs commands
  allowlist: []
  maxBlockedIps: 5000
