# Local stack. `docker compose up -d --build` then open http://localhost:8080
# The API applies EF Core migrations and seeds the demo organization + owner on first start (SPEC §17 Phase 0).
# Demo login: owner@example.com / kella-dev-password (two-factor setup runs on first sign-in).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kella
      POSTGRES_PASSWORD: kella-dev-password
      POSTGRES_DB: kella
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kella"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222"]
    volumes: [natsdata:/data]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command: ["-retentionPeriod=30d"]
    ports: ["8428:8428"]
    volumes: [vmdata:/victoria-metrics-data]

  api:
    build: { context: ./backend, args: { PROJECT: Kella.Api } }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Postgres: Host=postgres;Database=kella;Username=kella;Password=kella-dev-password
      Kella__RunPipelineInApi: "true"
      Kella__DevOrg__Enabled: "false" # exercise the real login page
      Kella__Jwt__Key: kella-compose-only-signing-key-32-bytes
      Kella__Jwt__SecureCookies: "false" # local stack is plain HTTP
      Kella__Seed__OrganizationName: Northwind Hosting (dev)
      Kella__Seed__OwnerEmail: owner@example.com
      Kella__Seed__OwnerPassword: kella-dev-password
      KELLA__COMMANDS__PRIVATEKEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # dev-only 32-byte zero seed
      Kella__Telegram__WebhookSecretToken: kella-dev-webhook-secret-token
      Kella__WebOrigins__0: http://localhost:8080
    ports: ["5080:5080"]
    depends_on:
      postgres: { condition: service_healthy }

  # Until NatsEventBus exists (Phase 1) the API runs the pipeline in-process; the worker is part of
  # the required full stack and starts idle, ready to host consumers once the bus is wired.
  worker:
    build: { context: ./backend, args: { PROJECT: Kella.Worker } }
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=kella;Username=kella;Password=kella-dev-password
      Nats__Url: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  natsdata:
  vmdata:
